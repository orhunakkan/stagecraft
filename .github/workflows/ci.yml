name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            coverage/
            client/coverage/
            server/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: stagecraft:${{ github.sha }}

  deploy-azure:
    name: Deploy to Azure App Service
    runs-on: windows-latest
    timeout-minutes: 20
    needs:
      - e2e
      - production-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Azure deployment secrets
        shell: pwsh
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_WEBAPP_NAME)) {
            throw "Missing GitHub repository secret: AZURE_WEBAPP_NAME"
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_WEBAPP_PUBLISH_PROFILE)) {
            throw "Missing GitHub repository secret: AZURE_WEBAPP_PUBLISH_PROFILE"
          }

      - name: Build Azure App Service package
        shell: pwsh
        run: npm run package:azure

      - name: Deploy ZIP package
        shell: pwsh
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          $packagePath = ".azure-publish/stagecraft-appservice.zip"
          if (-not (Test-Path -LiteralPath $packagePath)) {
            throw "Deployment package was not found: $packagePath"
          }

          [xml]$publishProfile = $env:AZURE_WEBAPP_PUBLISH_PROFILE
          $profile = $publishProfile.publishData.publishProfile |
            Where-Object { $_.publishMethod -eq "ZipDeploy" } |
            Select-Object -First 1

          if (-not $profile) {
            throw "Publish profile does not contain ZipDeploy credentials."
          }

          $credentials = "$($profile.userName):$($profile.userPWD)"
          $encodedCredentials = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($credentials))
          $headers = @{ Authorization = "Basic $encodedCredentials" }
          $deployUri = "https://$($profile.publishUrl.TrimEnd('/'))/api/zipdeploy?isAsync=true"

          Write-Host "Uploading deployment ZIP to Azure App Service..."
          $response = Invoke-WebRequest `
            -Method Post `
            -Uri $deployUri `
            -Headers $headers `
            -InFile $packagePath `
            -ContentType "application/zip"

          $statusUri = @($response.Headers.Location)[0]
          if (-not $statusUri) {
            Write-Host "Azure accepted the deployment request."
            return
          }

          do {
            Start-Sleep -Seconds 5
            $status = Invoke-RestMethod -Method Get -Uri $statusUri -Headers $headers
            Write-Host "Deployment status: $($status.status_text)"
          } while ($status.status -lt 3)

          if ($status.status -ne 4) {
            throw "Azure deployment failed: $($status.status_text)"
          }

          Write-Host "Azure deployment completed."
