<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter frame</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        background: #f9fafb;
      }
      h2 {
        font-size: 0.875rem;
        font-weight: 600;
        color: #374151;
        margin: 0 0 12px;
      }
      .count {
        font-size: 2rem;
        font-weight: 700;
        color: #1e1b4b;
        margin: 0 0 12px;
      }
      button {
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        background: white;
        font-size: 0.8rem;
        cursor: pointer;
        margin-right: 6px;
      }
      button:hover {
        background: #f3f4f6;
      }
      button.primary {
        background: #4f46e5;
        color: white;
        border-color: #4f46e5;
      }
      button.primary:hover {
        background: #4338ca;
      }
      input {
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 0.8rem;
        margin-top: 10px;
        display: block;
      }
      label {
        font-size: 0.8rem;
        color: #6b7280;
        display: block;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Embedded Counter</h2>
    <p class="count" id="count" role="status" aria-label="Counter value">0</p>
    <button class="primary" onclick="inc()">Increment</button>
    <button onclick="dec()">Decrement</button>
    <button onclick="reset()">Reset</button>
    <label for="step-input">Step size</label>
    <input id="step-input" type="number" value="1" min="1" max="100" aria-label="Step size" />
    <script>
      function getStep() {
        return parseInt(document.getElementById('step-input').value, 10) || 1;
      }
      function inc() {
        const el = document.getElementById('count');
        el.textContent = String(parseInt(el.textContent) + getStep());
      }
      function dec() {
        const el = document.getElementById('count');
        el.textContent = String(parseInt(el.textContent) - getStep());
      }
      function reset() {
        document.getElementById('count').textContent = '0';
      }
    </script>
  </body>
</html>
